name: Build libqemu-ios.so Artifact

on:
  push:
    paths:
      - ".github/workflows/build-engine.yml"
      - "engine/**"
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build meson pkg-config \
            python3 python3-pip git curl unzip texinfo bison flex

      - name: Set up Android NDK environment
        id: ndk
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          PREFIX="$GITHUB_WORKSPACE/deps-arm64"
          mkdir -p "$PREFIX/bin" "$PREFIX/lib"

          ln -sf "$TOOLCHAIN/bin/llvm-nm" "$TOOLCHAIN/bin/aarch64-linux-android29-nm"
          ln -sf "$TOOLCHAIN/bin/llvm-ar" "$TOOLCHAIN/bin/aarch64-linux-android29-ar"
          ln -sf "$TOOLCHAIN/bin/llvm-ranlib" "$TOOLCHAIN/bin/aarch64-linux-android29-ranlib"
          ln -sf "$TOOLCHAIN/bin/llvm-strip" "$TOOLCHAIN/bin/aarch64-linux-android29-strip"
          ln -sf "$TOOLCHAIN/bin/llvm-objcopy" "$TOOLCHAIN/bin/aarch64-linux-android29-objcopy"

          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV
          echo "PREFIX=$PREFIX" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV

      - name: Cache compiled arm64-v8a dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps-arm64
          key: arm64-deps-zlib1.3.1-ffi3.4.6-pcre10.43-glib2.78.4-pixman0.43.4-openssl3.3.2

      - name: Cross-compile zlib, libffi, pcre2, glib, pixman & openssl for arm64-v8a
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-deps"
          cd "$GITHUB_WORKSPACE/build-deps"

          cat > "$PREFIX/bin/aarch64-linux-android29-pkg-config" <<EOF
          #!/usr/bin/env bash
          export PKG_CONFIG_DIR=
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=
          exec pkg-config "\$@"
          EOF
          chmod +x "$PREFIX/bin/aarch64-linux-android29-pkg-config"

          cat > "$GITHUB_WORKSPACE/android-arm64-cross.txt" <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkg-config = '$PREFIX/bin/aarch64-linux-android29-pkg-config'

          [built-in options]
          c_args = ['-fPIC', '-Os', '-I$PREFIX/include']
          cpp_args = ['-fPIC', '-Os', '-I$PREFIX/include']
          c_link_args = ['-L$PREFIX/lib', '-Wl,-z,max-page-size=16384']
          cpp_link_args = ['-L$PREFIX/lib', '-Wl,-z,max-page-size=16384']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          # 1. zlib
          curl -L https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib.tar.gz
          tar xf zlib.tar.gz && cd zlib-1.3.1
          CHOST=aarch64-linux-android CFLAGS="-fPIC -Os" ./configure --prefix="$PREFIX" --static
          make -j$(nproc) && make install
          cd ..

          # 2. libffi
          curl -L https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz -o libffi.tar.gz
          tar xf libffi.tar.gz && cd libffi-3.4.6
          CFLAGS="-fPIC -Os" ./configure --host=aarch64-linux-android --prefix="$PREFIX" --disable-shared --enable-static
          make -j$(nproc) && make install
          cd ..

          # 3. pcre2
          curl -L https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.43/pcre2-10.43.tar.gz -o pcre2.tar.gz
          tar xf pcre2.tar.gz && cd pcre2-10.43
          CFLAGS="-fPIC -Os" ./configure --host=aarch64-linux-android --prefix="$PREFIX" --disable-shared --enable-static
          make -j$(nproc) && make install
          cd ..

          # 4. glib-2.0
          curl -L https://download.gnome.org/sources/glib/2.78/glib-2.78.4.tar.xz -o glib.tar.xz
          tar xf glib.tar.xz && cd glib-2.78.4
          meson setup _build --cross-file "$GITHUB_WORKSPACE/android-arm64-cross.txt" \
            --prefix="$PREFIX" --default-library=static \
            -Dtests=false -Dselinux=disabled -Dxattr=false -Dlibmount=disabled -Dnls=disabled
          ninja -C _build && ninja -C _build install
          cd ..

          # 5. pixman
          curl -L https://www.cairographics.org/releases/pixman-0.43.4.tar.gz -o pixman.tar.gz
          tar xf pixman.tar.gz && cd pixman-0.43.4
          meson setup _build --cross-file "$GITHUB_WORKSPACE/android-arm64-cross.txt" \
            --prefix="$PREFIX" --default-library=static \
            -Dtests=disabled -Dgtk=disabled -Dlibpng=disabled
          ninja -C _build && ninja -C _build install
          cd ..

          # 6. OpenSSL (AES / SHA1 / Bignum dla układów Apple S5L)
          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz -o openssl.tar.gz
          tar xf openssl.tar.gz && cd openssl-3.3.2
          ANDROID_NDK_ROOT="$NDK_DIR" PATH="$TOOLCHAIN/bin:$PATH" \
            ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
          ANDROID_NDK_ROOT="$NDK_DIR" PATH="$TOOLCHAIN/bin:$PATH" make -j$(nproc)
          ANDROID_NDK_ROOT="$NDK_DIR" PATH="$TOOLCHAIN/bin:$PATH" make install_sw
          cd ..

      - name: Ensure toolchain wrappers and Android librt stub exist
        run: |
          mkdir -p "$PREFIX/lib"
          "$AR" rcs "$PREFIX/lib/librt.a"

          cp "$PREFIX/bin/aarch64-linux-android29-pkg-config" "$TOOLCHAIN/bin/aarch64-linux-android29-pkg-config"
          chmod +x "$TOOLCHAIN/bin/aarch64-linux-android29-pkg-config"

          cat > "$PREFIX/bin/clang-pic-wrapper" <<EOF
          #!/usr/bin/env bash
          args=()
          for arg in "\$@"; do
            if [[ "\$arg" == "@qemu-system-arm.rsp" && -f "qemu-system-arm.rsp" ]]; then
              cp "qemu-system-arm.rsp" "$GITHUB_WORKSPACE/saved-qemu-system-arm.rsp"
            fi
            if [[ "\$arg" != "-fPIE" && "\$arg" != "-fpie" && "\$arg" != "-fno-pic" && "\$arg" != "-fno-PIC" ]]; then
              args+=("\$arg")
            fi
          done
          exec "$CC" -Qunused-arguments "\${args[@]}" -fPIC -ftls-model=global-dynamic
          EOF
          chmod +x "$PREFIX/bin/clang-pic-wrapper"

          cat > "$PREFIX/bin/clangxx-pic-wrapper" <<EOF
          #!/usr/bin/env bash
          args=()
          for arg in "\$@"; do
            if [[ "\$arg" != "-fPIE" && "\$arg" != "-fpie" && "\$arg" != "-fno-pic" && "\$arg" != "-fno-PIC" ]]; then
              args+=("\$arg")
            fi
          done
          exec "$CXX" -Qunused-arguments "\${args[@]}" -fPIC -ftls-model=global-dynamic
          EOF
          chmod +x "$PREFIX/bin/clangxx-pic-wrapper"

      - name: Clone & build qemu-ios core + JNI wrapper into libqemu-ios.so
        run: |
          cd "$GITHUB_WORKSPACE"
          export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 https://github.com/samhenrigold/qemu-ios.git qemu-ios-src || \
          git clone --depth 1 https://github.com/devos50/qemu-ios.git qemu-ios-src

          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG="$TOOLCHAIN/bin/aarch64-linux-android29-pkg-config"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          mkdir -p qemu-ios-build && cd qemu-ios-build
          ../qemu-ios-src/configure \
            --cross-prefix="$TOOLCHAIN/bin/aarch64-linux-android29-" \
            --cc="$PREFIX/bin/clang-pic-wrapper" \
            --cxx="$PREFIX/bin/clangxx-pic-wrapper" \
            --target-list=arm-softmmu \
            --enable-tcg \
            --disable-pie \
            --disable-plugins \
            --disable-kvm \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc \
            --disable-curses \
            --disable-dbus-display \
            --disable-virtfs \
            --disable-vhost-user \
            --disable-vhost-kernel \
            --disable-vhost-net \
            --disable-vhost-crypto \
            --disable-vhost-vdpa \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-werror \
            --extra-cflags="-fPIC -ftls-model=global-dynamic -Os -ffunction-sections -fdata-sections -I$PREFIX/include -DQEMU_IOS_EMBEDDED=1" \
            --extra-ldflags="-L$PREFIX/lib -lssl -lcrypto -Wl,-z,max-page-size=16384"

          sed -i 's/-fPIE/-fPIC/g; s/-fpie/-fPIC/g' build.ninja
          ninja qemu-system-arm

          # Kompilujemy qemu_ios_jni.c do pliku obiektowego
          "$PREFIX/bin/clang-pic-wrapper" -c -Os -ffunction-sections -fdata-sections \
            -I"$GITHUB_WORKSPACE/qemu-ios-build" \
            -I"$GITHUB_WORKSPACE/qemu-ios-src/include" \
            -I"$PREFIX/include" \
            -I"$PREFIX/include/pixman-1" \
            -I"$PREFIX/include/glib-2.0" \
            -I"$PREFIX/lib/glib-2.0/include" \
            "$GITHUB_WORKSPACE/engine/qemu_ios_jni.c" \
            -o qemu_ios_jni.o

          # Podmieniamy system_main.c.o na qemu_ios_jni.o w przechwyconym pliku .rsp
          sed 's|qemu-system-arm\.p/system_main\.c\.o|qemu_ios_jni.o|g' \
            "$GITHUB_WORKSPACE/saved-qemu-system-arm.rsp" > libqemu-ios.rsp

          mkdir -p "$GITHUB_WORKSPACE/out/arm64-v8a"
          "$PREFIX/bin/clang-pic-wrapper" -shared \
            @libqemu-ios.rsp \
            -landroid -llog \
            -o "$GITHUB_WORKSPACE/out/arm64-v8a/libqemu-ios.so"

          "$STRIP" --strip-all "$GITHUB_WORKSPACE/out/arm64-v8a/libqemu-ios.so"
          ls -lh "$GITHUB_WORKSPACE/out/arm64-v8a/libqemu-ios.so"

      - name: Upload libqemu-ios.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libqemu-ios-arm64
          path: out/arm64-v8a/libqemu-ios.so
