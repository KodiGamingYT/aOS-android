name: Build aOS APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & extract libqemu-ios.so from build-engine
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-engine.yml
          workflow_conclusion: success
          name: libqemu-ios-arm64
          path: app/src/main/jniLibs/arm64-v8a

      - name: Verify libqemu-ios.so placement
        run: |
          ls -lh app/src/main/jniLibs/arm64-v8a/libqemu-ios.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload aOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
